apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-ticket
  namespace: discord-ticket
  labels:
    app.kubernetes.io/name: discord-ticket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-ticket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-ticket
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker-1
                      - k8s-worker-2
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /runtime/data
              if [ ! -s /runtime/config.json ]; then
                cp /seed/config.json /runtime/config.json
              fi
              chown -R 1000:1000 /runtime
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/tenshi-lab-kube/discord-ticket:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: WEB_PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: CONFIG_PATH
              value: /app/runtime/config.json
            - name: DB_PATH
              value: /app/runtime/data/tickets.db
            - name: PUBLIC_URL
              value: https://tickets.tenshi-lab.fr
          envFrom:
            - secretRef:
                name: discord-ticket-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: discord-ticket-data
        - name: config-seed
          secret:
            secretName: discord-ticket-config
