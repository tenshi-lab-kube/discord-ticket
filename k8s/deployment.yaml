apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-ticket
  namespace: discord-ticket
  labels:
    app.kubernetes.io/name: discord-ticket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-ticket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-ticket
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker-1
                      - k8s-worker-2
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /runtime/data
              if [ ! -s /runtime/config.json ]; then
                cp /seed/config.json /runtime/config.json
              fi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/tenshi-lab-kube/discord-ticket:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: WEB_PORT
              value: "3000"
            - name: CONFIG_PATH
              value: /app/runtime/config.json
            - name: DB_PATH
              value: /app/runtime/data/tickets.db
          envFrom:
            - secretRef:
                name: discord-ticket-env
          readinessProbe:
            httpGet:
              path: /auth/check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: discord-ticket-data
        - name: config-seed
          secret:
            secretName: discord-ticket-config
