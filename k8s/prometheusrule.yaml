apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: discord-ticket-alerts
  namespace: discord-ticket
  labels:
    release: monitoring
spec:
  groups:
    - name: discord-ticket
      rules:
        - alert: DiscordTicketDown
          expr: up{namespace="discord-ticket", service="discord-ticket"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Discord Ticket bot is down
        - alert: DiscordTicketRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="discord-ticket", container="app"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Discord Ticket bot restarted recently
